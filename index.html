    <style>
/* 系統字型優先，無需連線也能正確顯示 */

:root {
  --bg: #f3efe6;
  --bg-sunken: #e8e0d2;
  --surface: #faf7f1;
  --surface-2: #fffdf8;

  --subtle: #8a8276;

  --reported: #9a4a1f;

  --technician: #1e4a45;
  --technician-bg: #dce8e5;
  --office: #2c4a5e;
  --office-bg: #dce8ef;
  --edb: #3d4f46;

}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-font-smoothing: antialiased;
}

body {

  color: var(--fg);
  line-height: 1.5;
  overflow-x: hidden;
}

button:not(:disabled),
[role="button"]:not(:disabled) {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;

.sr-only {

  height: 1px;

  overflow: hidden;

  border: 0;
}

/* Header */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);

  max-width: 72rem;

  font-weight: 600;
  color: var(--primary);
}

.brand-sub {
  font-size: 0.75rem;
  color: var(--muted);

}

.nav-desktop {

.nav-desktop a {

.nav-desktop a:hover {

}

.nav-desktop a.active {

}

.header-actions {
  margin-left: auto;

  gap: 0.5rem;
}

.identity-chip {
  display: none;

  max-width: 10rem;

  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 0.875rem;
  text-align: left;
}

.identity-chip:hover {
  background: var(--surface);
}

.identity-chip strong {
  display: block;
  font-weight: 500;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.identity-chip span {
  display: block;
  font-size: 0.7rem;
  color: var(--muted);
  line-height: 1.2;
}

.nav-mobile {
  display: flex;
  gap: 0.25rem;
  overflow-x: auto;
  padding: 0.5rem 0.75rem;
  border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
}

.nav-mobile a,
.nav-mobile button {
  flex-shrink: 0;
  padding: 0.5rem 0.75rem;
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
}

.nav-mobile a.active {
  background: var(--primary);
  color: var(--primary-fg);
  border-color: transparent;
}

.nav-mobile button {
  margin-left: auto;
}

@media (min-width: 768px) {
  .nav-desktop {
    display: flex;
  }
  .nav-mobile {
    display: none;
  }
  .identity-chip {
    display: flex;
  }
  .brand-sub {
    display: inline;
  }
  .header-inner {
    padding: 0.75rem 1.5rem;
  }
}

@media (max-width: 767px) {
  .brand-sub {
    display: none;
  }
}

/* Main */
main {
  max-width: 72rem;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
  min-width: 0;
}

@media (min-width: 640px) {
  main {
    padding: 2rem 1.5rem 4rem;
  }
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  height: 2.75rem;
  padding: 0 1rem;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn:not(:disabled):active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--primary);
  color: var(--primary-fg);
  box-shadow: var(--shadow);
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--fg);
  box-shadow: var(--shadow);
}

.btn-secondary:hover:not(:disabled) {
  box-shadow: 0 0 0 1px rgb(28 25 20 / 0.1), 0 2px 8px -1px rgb(28 25 20 / 0.08);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-ghost {
  background: transparent;
  color: var(--fg);
}

.btn-ghost:hover {
  background: var(--bg-sunken);
}

.btn-sm {
  height: 2.25rem;
  padding: 0 0.75rem;
  font-size: 0.8125rem;
  border-radius: 8px;
}

.btn-icon {
  width: 2.25rem;
  padding: 0;
}

/* Forms */
.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field label {
  font-size: 0.875rem;
  font-weight: 500;
  color: #3d4a48;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  height: 2.75rem;
  padding: 0 0.75rem;

  border-radius: 10px;

  font-size: 0.875rem;
  color: var(--fg);
}

.field textarea {
  height: auto;

  padding: 0.65rem 0.75rem;

}

.field input:focus,
.field select:focus,
.field textarea:focus {

  box-shadow: 0 0 0 2px var(--primary);
}

.field select {

  background-repeat: no-repeat;
  background-position: right 0.75rem center;
  padding-right: 2.5rem;
}

.form-grid {
  display: grid;
  gap: 1rem;
}

@media (min-width: 640px) {
  .form-grid-2 {
    grid-template-columns: 1fr 1fr;
  }
}

.form-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 1.25rem;
  box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  .form-card {
    padding: 1.5rem;
  }
}

.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 0.15rem 0.65rem;
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
}

.badge-reported {
  background: var(--reported-bg);
  color: var(--reported);
}
.badge-technician {
  background: var(--technician-bg);
  color: var(--technician);
}
.badge-office {
  background: var(--office-bg);
  color: var(--office);
}
.badge-edb {
  background: var(--edb-bg);
  color: var(--edb);
}
.badge-observing {
  background: var(--observing-bg);
  color: var(--observing);
}
.badge-on_hold {
  background: var(--on_hold-bg);
  color: var(--on_hold);
}
.badge-done {
  background: var(--done-bg);
  color: var(--done);
}

/* Cards */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

@media (min-width: 1024px) {
  .stat-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.stat-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.stat-card.warn {

}

.stat-card .label {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
}

.stat-card .value {
  margin-top: 0.35rem;
  font-family: var(--display);
  font-size: 1.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.stat-card.warn .value {
  color: var(--warn);
}

.room-grid {
  display: grid;
  gap: 0.75rem;
}

@media (min-width: 640px) {
  .room-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (min-width: 1024px) {
  .room-grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}

.room-card,
.issue-card {
  position: relative;
  display: block;
  overflow: hidden;
  background: var(--surface);
  border-radius: 18px;
  padding: 1rem;
  box-shadow: var(--shadow);
  transition: box-shadow 0.2s;
  min-width: 0;
}

.room-card:hover,
.issue-card:hover {
  box-shadow: 0 0 0 1px rgb(28 25 20 / 0.1), 0 2px 8px -1px rgb(28 25 20 / 0.08),
    0 8px 20px -8px rgb(28 25 20 / 0.12);
}

.room-card .bar,
.issue-card .bar {
  position: absolute;
  top: 0.75rem;
  bottom: 0.75rem;
  left: 0;
  width: 4px;
  border-radius: 999px;
}

.room-card .body,
.issue-card .body {
  padding-left: 0.75rem;
}

.bar-done {
  background: var(--done);
}
.bar-warn {
  background: var(--warn);
}
.bar-reported {
  background: var(--reported);
}
.bar-technician {
  background: var(--technician);
}
.bar-office {
  background: var(--office);
}
.bar-edb {
  background: var(--edb);
}
.bar-observing {
  background: var(--observing);
}
.bar-on_hold {
  background: var(--on_hold);
}

.alert-box {
  background: var(--warn-bg);
  border-radius: 18px;
  padding: 1rem 1.25rem;
}

.alert-box h2 {
  margin: 0;
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 500;
}

.alert-box p {
  margin: 0.35rem 0 0;
  font-size: 0.875rem;
  color: var(--warn);
}

.page-header {
  margin-bottom: 1.5rem;
}

.page-header .eyebrow {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.page-header h1 {
  margin: 0.25rem 0 0;
  font-size: clamp(1.75rem, 4vw, 2.25rem);
}

.page-header p {
  margin: 0.5rem 0 0;
  max-width: 36rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.section-title {
  margin: 1.5rem 0 0.75rem;
  font-size: 1.125rem;
}

.muted {
  color: var(--muted);
  font-size: 0.875rem;
}

.meta {
  font-size: 0.75rem;
  color: var(--muted);
}

/* Board table */
.table-wrap {
  overflow-x: auto;
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

table.board {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  font-size: 0.875rem;
  text-align: left;
}

table.board th {
  padding: 0.75rem 1rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}

table.board td {
  padding: 0.75rem 1rem;
  vertical-align: top;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
}

table.board a:hover {
  text-decoration: underline;
}

.board-mobile {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

@media (min-width: 768px) {
  .board-mobile {
    display: none;
  }
  .board-desktop {
    display: block;
  }
}

@media (max-width: 767px) {
  .board-desktop {
    display: none;
  }
}

.mobile-room-block {
  background: var(--surface);
  border-radius: 18px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.mobile-room-block .issue-row {
  border-top: 1px solid var(--border);
  padding-top: 0.75rem;
  margin-top: 0.75rem;
}

/* Timeline */
.timeline {
  margin: 0;
  padding: 0 0 0 0.75rem;
  list-style: none;
  border-left: 1px solid var(--border);
}

.timeline li {
  position: relative;
  padding: 0 0 1.5rem 1.5rem;
}

.timeline li:last-child {
  padding-bottom: 0;
}

.timeline .dot {
  position: absolute;
  top: 0.4rem;
  left: -0.3rem;
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: var(--border-strong);
}

.timeline .dot.latest {
  background: var(--primary);
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgb(28 25 20 / 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal {
  width: 100%;
  max-width: 28rem;
  background: var(--surface);
  border-radius: 18px;
  padding: 1.5rem;
  box-shadow: var(--shadow);
  position: relative;
}

.modal h2 {
  margin: 0;
  font-size: 1.25rem;
}

.modal p {
  margin: 0.35rem 0 0;
  font-size: 0.875rem;
  color: var(--muted);
}

.modal .close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 1.25rem;
  line-height: 1;
  padding: 0.25rem;
}

.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}

.role-btn {
  height: 2.75rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 500;
}

.role-btn.active {
  background: var(--primary);
  color: var(--primary-fg);
  border-color: transparent;
}

/* Toast */
#toast-root {
  position: fixed;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}

.toast {
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 1rem;
  font-size: 0.875rem;
  box-shadow: var(--shadow);
  animation: fade-in 0.2s ease;
}

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.mode-banner {
  font-size: 0.75rem;
  color: var(--muted);
  background: var(--bg-sunken);
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  margin-bottom: 1rem;
}

.mode-banner code {
  font-size: 0.7rem;
  background: var(--surface);
  padding: 0.1rem 0.35rem;
  border-radius: 4px;
}

.hidden {
  display: none !important;
}

.flex-between {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.gap-4 {
  gap: 1rem;
}

.mt-2 {
  margin-top: 0.5rem;
}
.mt-3 {
  margin-top: 0.75rem;
}
.mt-4 {
  margin-top: 1rem;
}
.mb-2 {
  margin-bottom: 0.5rem;
}

.link-back {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.875rem;
  color: var(--muted);
  margin-bottom: 1rem;
}

.link-back:hover {
  color: var(--fg);
}

.detail-panel {
  background: var(--surface);
  border-radius: 18px;
  padding: 1.25rem 1.5rem;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.detail-panel .bar {
  position: absolute;
  top: 1rem;
  bottom: 1rem;
  left: 0;
  width: 4px;
  border-radius: 999px;
}

.detail-panel .inner {
  padding-left: 0.75rem;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-top: 1rem;
  font-size: 0.875rem;
}

@media (min-width: 640px) {
  .meta-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.meta-grid dt {
  font-size: 0.75rem;
  color: var(--muted);
}

.meta-grid dd {
  margin: 0.15rem 0 0;
  font-weight: 500;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding-top: 0.5rem;
}

.empty-ok {
  background: var(--done-bg);
  color: var(--done);
  border-radius: 18px;
  padding: 2rem 1.25rem;
  text-align: center;
}

.empty-ok h2 {
  margin: 0;
  font-size: 1.25rem;
  color: var(--done);
}

.empty-ok p {
  margin: 0.5rem 0 0;
  font-size: 0.875rem;
}

.actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.delete-btn {
  color: var(--danger);
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
  border-radius: 8px;
  height: 2rem;
  padding: 0 0.65rem;
  font-size: 0.75rem;
  font-family: inherit;
  font-weight: 500;
}

.delete-btn:hover {
  background: var(--danger-bg);
}

      <p class="muted">載入中…</p>

    <div id="toast-root"></div>

    <div id="identity-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <button type="button" class="close" id="identity-close" aria-label="關閉">×</button>
        <h2>你是誰？</h2>
        <p>名稱會寫進跟進紀錄。沒有登入帳號；換部裝置請再填一次。</p>
        <form id="identity-form" class="stack gap-4" style="margin-top: 1.25rem">
          <div class="field">
            <label for="identity-name">名稱或簡稱</label>
            <input id="identity-name" required placeholder="例如：豪哥、Phoebe、WCW" autocomplete="name" />
          </div>
          <div class="field">
            <label>身份</label>
            <div class="role-grid">
              <button type="button" class="role-btn active" data-role="teacher">老師</button>
              <button type="button" class="role-btn" data-role="technician">技術員</button>
              <button type="button" class="role-btn" data-role="office">校務處</button>
              <button type="button" class="role-btn" data-role="coordinator">理科組</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%">記住我</button>
        </form>
      </div>
    </div>

    <script>
      // 若 js 資料夾缺失，3 秒後顯示清楚錯誤（避免永遠「載入中」）
      setTimeout(function () {
        if (!window.CATALOG || !window.API) {
          var app = document.getElementById("app");
          if (app) {
            app.innerHTML =
              '<div class="alert-box" style="max-width:36rem;margin:2rem auto">' +
              "<h2>無法載入程式</h2>" +
              "<p style=\"margin-top:0.75rem;color:var(--fg)\">請確認你是<strong>解壓整個資料夾</strong>後再開 <code>index.html</code>，" +
              "同一層要有 <code>js/</code> 與 <code>css/</code> 資料夾。</p>" +
              "<p style=\"margin-top:0.5rem\">正確結構：</p>" +
              "<pre style=\"background:var(--surface);padding:0.75rem;border-radius:8px;font-size:0.8rem;overflow:auto\">shi-kuang-tai/\n  index.html\n  css/\n  js/\n  google-apps-script/\n  README.md</pre>" +
              "<p style=\"margin-top:0.75rem\">或用本機伺服器：在資料夾內執行 <code>python3 -m http.server 8080</code>，再打開 http://localhost:8080</p>" +
              "</div>";
          }
        }
      }, 2500);
    </script>
