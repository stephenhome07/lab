<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V1.01 室況台 · 理科組設備檢查</title>
    <meta name="description" content="理科組實驗室與特別室設備檢查、報修與每月點名。" />
    <meta name="theme-color" content="#1E4A45" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E4A45'/%3E%3Crect x='7' y='8' width='18' height='16' rx='2.5' fill='%23F3EFE6'/%3E%3Crect x='7' y='8' width='4' height='16' rx='1.5' fill='%23C45C26'/%3E%3C/svg%3E" />
    <style>
/* 系統字型優先，無需連線也能正確顯示 */

:root {
  --bg: #f3efe6;
  --bg-sunken: #e8e0d2;
  --surface: #faf7f1;
  --surface-2: #fffdf8;
  --fg: #1c1914;
  --muted: #6b6458;
  --subtle: #8a8276;
  --border: #d9d0c0;
  --border-strong: #c4b8a4;
  --primary: #1e4a45;
  --primary-fg: #faf7f1;
  --primary-hover: #163833;
  --reported: #9a4a1f;
  --reported-bg: #f4e4d4;
  --technician: #1e4a45;
  --technician-bg: #dce8e5;
  --office: #2c4a5e;
  --office-bg: #dce8ef;
  --edb: #3d4f46;
  --edb-bg: #dfe8e2;
  --observing: #5a5340;
  --observing-bg: #ebe6d4;
  --on_hold: #5c574e;
  --on_hold-bg: #ece7dc;
  --done: #3d5a3a;
  --done-bg: #dce8d8;
  --danger: #8f2d22;
  --danger-bg: #f3ddd8;
  --warn: #8a5a12;
  --warn-bg: #f3e6c8;
  --radius: 12px;
  --shadow: 0 0 0 1px rgb(28 25 20 / 0.06), 0 1px 2px -1px rgb(28 25 20 / 0.06),
    0 2px 8px 0 rgb(28 25 20 / 0.04);
  --font: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
  --display: "Songti TC", "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font);
  background: var(--bg);
  background-image: linear-gradient(rgb(28 25 20 / 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgb(28 25 20 / 0.035) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--fg);
  line-height: 1.5;
  overflow-x: hidden;
}

button:not(:disabled),
[role="button"]:not(:disabled) {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

/* Header */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px);
}

.header-inner {
  max-width: 72rem;
  margin: 0 auto;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  min-width: 0;
}

.brand-title {
  font-family: var(--display);
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--primary);
}

.brand-sub {
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-desktop {
  display: none;
  gap: 0.25rem;
  margin-left: 0.5rem;
}

.nav-desktop a {
  padding: 0.5rem 0.75rem;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--muted);
}

.nav-desktop a:hover {
  background: var(--bg-sunken);
  color: var(--fg);
}

.nav-desktop a.active {
  background: var(--primary);
  color: var(--primary-fg);
}

.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.identity-chip {
  display: none;
  align-items: center;
  gap: 0.5rem;
  height: 2.75rem;
  max-width: 10rem;
  padding: 0 0.75rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 0.875rem;
  text-align: left;
}

.identity-chip:hover {
  background: var(--surface);
}

.identity-chip strong {
  display: block;
  font-weight: 500;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.identity-chip span {
  display: block;
  font-size: 0.7rem;
  color: var(--muted);
  line-height: 1.2;
}

.nav-mobile {
  display: flex;
  gap: 0.25rem;
  overflow-x: auto;
  padding: 0.5rem 0.75rem;
  border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
}

.nav-mobile a,
.nav-mobile button {
  flex-shrink: 0;
  padding: 0.5rem 0.75rem;
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
}

.nav-mobile a.active {
  background: var(--primary);
  color: var(--primary-fg);
  border-color: transparent;
}

.nav-mobile button {
  margin-left: auto;
}

@media (min-width: 768px) {
  .nav-desktop {
    display: flex;
  }
  .nav-mobile {
    display: none;
  }
  .identity-chip {
    display: flex;
  }
  .brand-sub {
    display: inline;
  }
  .header-inner {
    padding: 0.75rem 1.5rem;
  }
}

@media (max-width: 767px) {
  .brand-sub {
    display: none;
  }
}

/* Main */
main {
  max-width: 72rem;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
  min-width: 0;
}

@media (min-width: 640px) {
  main {
    padding: 2rem 1.5rem 4rem;
  }
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  height: 2.75rem;
  padding: 0 1rem;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn:not(:disabled):active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--primary);
  color: var(--primary-fg);
  box-shadow: var(--shadow);
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--fg);
  box-shadow: var(--shadow);
}

.btn-secondary:hover:not(:disabled) {
  box-shadow: 0 0 0 1px rgb(28 25 20 / 0.1), 0 2px 8px -1px rgb(28 25 20 / 0.08);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-ghost {
  background: transparent;
  color: var(--fg);
}

.btn-ghost:hover {
  background: var(--bg-sunken);
}

.btn-sm {
  height: 2.25rem;
  padding: 0 0.75rem;
  font-size: 0.8125rem;
  border-radius: 8px;
}

.btn-icon {
  width: 2.25rem;
  padding: 0;
}

/* Forms */
.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field label {
  font-size: 0.875rem;
  font-weight: 500;
  color: #3d4a48;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  height: 2.75rem;
  padding: 0 0.75rem;
  border: none;
  border-radius: 10px;
  background: var(--surface-2);
  box-shadow: 0 0 0 1px var(--border);
  font-family: inherit;
  font-size: 0.875rem;
  color: var(--fg);
}

.field textarea {
  height: auto;
  min-height: 5.5rem;
  padding: 0.65rem 0.75rem;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  box-shadow: 0 0 0 2px var(--primary);
}

.field select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b6458' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 0.75rem center;
  padding-right: 2.5rem;
}

.form-grid {
  display: grid;
  gap: 1rem;
}

@media (min-width: 640px) {
  .form-grid-2 {
    grid-template-columns: 1fr 1fr;
  }
}

.form-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 1.25rem;
  box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  .form-card {
    padding: 1.5rem;
  }
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 0.15rem 0.65rem;
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
}

.badge-reported {
  background: var(--reported-bg);
  color: var(--reported);
}
.badge-technician {
  background: var(--technician-bg);
  color: var(--technician);
}
.badge-office {
  background: var(--office-bg);
  color: var(--office);
}
.badge-edb {
  background: var(--edb-bg);
  color: var(--edb);
}
.badge-observing {
  background: var(--observing-bg);
  color: var(--observing);
}
.badge-on_hold {
  background: var(--on_hold-bg);
  color: var(--on_hold);
}
.badge-done {
  background: var(--done-bg);
  color: var(--done);
}

/* Cards */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

@media (min-width: 1024px) {
  .stat-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.stat-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.stat-card.warn {
  background: var(--warn-bg);
}

.stat-card .label {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
}

.stat-card .value {
  margin-top: 0.35rem;
  font-family: var(--display);
  font-size: 1.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.stat-card.warn .value {
  color: var(--warn);
}

.room-grid {
  display: grid;
  gap: 0.75rem;
}

@media (min-width: 640px) {
  .room-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (min-width: 1024px) {
  .room-grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}

.room-card,
.issue-card {
  position: relative;
  display: block;
  overflow: hidden;
  background: var(--surface);
  border-radius: 18px;
  padding: 1rem;
  box-shadow: var(--shadow);
  transition: box-shadow 0.2s;
  min-width: 0;
}

.room-card:hover,
.issue-card:hover {
  box-shadow: 0 0 0 1px rgb(28 25 20 / 0.1), 0 2px 8px -1px rgb(28 25 20 / 0.08),
    0 8px 20px -8px rgb(28 25 20 / 0.12);
}

.room-card .bar,
.issue-card .bar {
  position: absolute;
  top: 0.75rem;
  bottom: 0.75rem;
  left: 0;
  width: 4px;
  border-radius: 999px;
}

.room-card .body,
.issue-card .body {
  padding-left: 0.75rem;
}

.bar-done {
  background: var(--done);
}
.bar-warn {
  background: var(--warn);
}
.bar-reported {
  background: var(--reported);
}
.bar-technician {
  background: var(--technician);
}
.bar-office {
  background: var(--office);
}
.bar-edb {
  background: var(--edb);
}
.bar-observing {
  background: var(--observing);
}
.bar-on_hold {
  background: var(--on_hold);
}

.alert-box {
  background: var(--warn-bg);
  border-radius: 18px;
  padding: 1rem 1.25rem;
}

.alert-box h2 {
  margin: 0;
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 500;
}

.alert-box p {
  margin: 0.35rem 0 0;
  font-size: 0.875rem;
  color: var(--warn);
}

.page-header {
  margin-bottom: 1.5rem;
}

.page-header .eyebrow {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.page-header h1 {
  margin: 0.25rem 0 0;
  font-size: clamp(1.75rem, 4vw, 2.25rem);
}

.page-header p {
  margin: 0.5rem 0 0;
  max-width: 36rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.section-title {
  margin: 1.5rem 0 0.75rem;
  font-size: 1.125rem;
}

.muted {
  color: var(--muted);
  font-size: 0.875rem;
}

.meta {
  font-size: 0.75rem;
  color: var(--muted);
}

/* Board table */
.table-wrap {
  overflow-x: auto;
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

table.board {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  font-size: 0.875rem;
  text-align: left;
}

table.board th {
  padding: 0.75rem 1rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}

table.board td {
  padding: 0.75rem 1rem;
  vertical-align: top;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
}

table.board a:hover {
  text-decoration: underline;
}

.board-mobile {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

@media (min-width: 768px) {
  .board-mobile {
    display: none;
  }
  .board-desktop {
    display: block;
  }
}

@media (max-width: 767px) {
  .board-desktop {
    display: none;
  }
}

.mobile-room-block {
  background: var(--surface);
  border-radius: 18px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.mobile-room-block .issue-row {
  border-top: 1px solid var(--border);
  padding-top: 0.75rem;
  margin-top: 0.75rem;
}

/* Timeline */
.timeline {
  margin: 0;
  padding: 0 0 0 0.75rem;
  list-style: none;
  border-left: 1px solid var(--border);
}

.timeline li {
  position: relative;
  padding: 0 0 1.5rem 1.5rem;
}

.timeline li:last-child {
  padding-bottom: 0;
}

.timeline .dot {
  position: absolute;
  top: 0.4rem;
  left: -0.3rem;
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: var(--border-strong);
}

.timeline .dot.latest {
  background: var(--primary);
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgb(28 25 20 / 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal {
  width: 100%;
  max-width: 28rem;
  background: var(--surface);
  border-radius: 18px;
  padding: 1.5rem;
  box-shadow: var(--shadow);
  position: relative;
}

.modal h2 {
  margin: 0;
  font-size: 1.25rem;
}

.modal p {
  margin: 0.35rem 0 0;
  font-size: 0.875rem;
  color: var(--muted);
}

.modal .close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 1.25rem;
  line-height: 1;
  padding: 0.25rem;
}

.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}

.role-btn {
  height: 2.75rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 500;
}

.role-btn.active {
  background: var(--primary);
  color: var(--primary-fg);
  border-color: transparent;
}

/* Toast */
#toast-root {
  position: fixed;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}

.toast {
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 1rem;
  font-size: 0.875rem;
  box-shadow: var(--shadow);
  animation: fade-in 0.2s ease;
}

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.mode-banner {
  font-size: 0.75rem;
  color: var(--muted);
  background: var(--bg-sunken);
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  margin-bottom: 1rem;
}

.mode-banner code {
  font-size: 0.7rem;
  background: var(--surface);
  padding: 0.1rem 0.35rem;
  border-radius: 4px;
}

.hidden {
  display: none !important;
}

.flex-between {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.gap-4 {
  gap: 1rem;
}

.mt-2 {
  margin-top: 0.5rem;
}
.mt-3 {
  margin-top: 0.75rem;
}
.mt-4 {
  margin-top: 1rem;
}
.mb-2 {
  margin-bottom: 0.5rem;
}

.link-back {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.875rem;
  color: var(--muted);
  margin-bottom: 1rem;
}

.link-back:hover {
  color: var(--fg);
}

.detail-panel {
  background: var(--surface);
  border-radius: 18px;
  padding: 1.25rem 1.5rem;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.detail-panel .bar {
  position: absolute;
  top: 1rem;
  bottom: 1rem;
  left: 0;
  width: 4px;
  border-radius: 999px;
}

.detail-panel .inner {
  padding-left: 0.75rem;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-top: 1rem;
  font-size: 0.875rem;
}

@media (min-width: 640px) {
  .meta-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.meta-grid dt {
  font-size: 0.75rem;
  color: var(--muted);
}

.meta-grid dd {
  margin: 0.15rem 0 0;
  font-weight: 500;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding-top: 0.5rem;
}

.empty-ok {
  background: var(--done-bg);
  color: var(--done);
  border-radius: 18px;
  padding: 2rem 1.25rem;
  text-align: center;
}

.empty-ok h2 {
  margin: 0;
  font-size: 1.25rem;
  color: var(--done);
}

.empty-ok p {
  margin: 0.5rem 0 0;
  font-size: 0.875rem;
}

.actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.delete-btn {
  color: var(--danger);
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
  border-radius: 8px;
  height: 2rem;
  padding: 0 0.65rem;
  font-size: 0.75rem;
  font-family: inherit;
  font-weight: 500;
}

.delete-btn:hover {
  background: var(--danger-bg);
}

    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="#/" class="brand">
          <span class="brand-title">室況台</span>
          <span class="brand-sub">理科組設備檢查</span>
        </a>

    <script>
/**
 * 資料層：優先呼叫 Google Apps Script；失敗時 bootstrap 可退回本機示範
 */
(function () {
  const STORAGE_KEY = "shi-kuang-tai-v1";

  function todayISO() {
    const d = new Date();
    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0"),
    ].join("-");
  }

  function addDays(iso, days) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0"),
    ].join("-");
  }

  function isDue(issue) {
    if (issue.status === "done") return false;
    const next = addDays(issue.last_checked_on, window.APP_CONFIG.CHECK_INTERVAL_DAYS);
    return next <= todayISO();
  }

  function enrichIssue(issue, rooms) {
    const room = rooms.find((r) => r.id === issue.room_id) || {};
    return {
      ...issue,
      room_code: room.code || issue.room_id,
      room_name: room.name || "",
      room_wing: room.wing || "",
      room_floor: room.floor || "",
    };
  }

  function loadLocal() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        return JSON.parse(raw);
      } catch (_) {}
    }
    const data = {
      rooms: window.CATALOG.ROOMS.map((r) => ({ ...r })),
      issues: window.SEED.issues.map((i) => ({ ...i })),
      updates: window.SEED.updates.map((u, idx) => ({ id: idx + 1, ...u })),
      nextIssueId: Math.max(0, ...window.SEED.issues.map((i) => i.id)) + 1,
      nextUpdateId: window.SEED.updates.length + 1,
    };
    saveLocal(data);
    return data;
  }

  function saveLocal(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  async function localCall(action, payload = {}) {
    const db = loadLocal();
    switch (action) {
      case "bootstrap": {
        return {
          rooms: db.rooms,
          issues: db.issues.map((i) => enrichIssue(i, db.rooms)),
          updates: db.updates,
          mode: "local",
        };
      }
      case "createIssue": {
        const id = db.nextIssueId++;
        const issue = {
          id,
          room_id: payload.roomId,
          title: payload.title,
          category: payload.category,
          status: payload.status,
          assignee: payload.assignee || "",
          reported_on: payload.reportedOn,
          last_checked_on: payload.reportedOn,
        };
        db.issues.push(issue);
        db.updates.push({
          id: db.nextUpdateId++,
          issue_id: id,
          status: payload.status,
          note: payload.note,
          author_name: payload.authorName,
          author_role: payload.authorRole,
          happened_on: payload.reportedOn,
        });
        saveLocal(db);
        return { id };
      }
      case "addUpdate": {
        const issue = db.issues.find((i) => i.id === Number(payload.issueId));
        if (!issue) throw new Error("找不到此問題");
        db.updates.push({
          id: db.nextUpdateId++,
          issue_id: issue.id,
          status: payload.status,
          note: payload.note,
          author_name: payload.authorName,
          author_role: payload.authorRole,
          happened_on: payload.happenedOn,
        });
        issue.status = payload.status;
        issue.last_checked_on = payload.happenedOn;
        if (payload.assignee !== undefined) issue.assignee = payload.assignee;
        saveLocal(db);
        return { ok: true };
      }
      case "deleteIssue": {
        const id = Number(payload.issueId);
        db.issues = db.issues.filter((i) => i.id !== id);
        db.updates = db.updates.filter((u) => u.issue_id !== id);
        saveLocal(db);
        return { ok: true };
      }
      default:
        throw new Error("未知操作：" + action);
    }
  }

  async function remoteCall(action, payload = {}) {
    const url = (window.APP_CONFIG.APPS_SCRIPT_URL || "").trim();
    if (!url) throw new Error("未設定 APPS_SCRIPT_URL");

    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload }),
        redirect: "follow",
      });
    } catch (err) {
      throw new Error(
        "無法連線 Google Sheet。請用 localhost 或 GitHub Pages 開啟（不要雙擊 file://），並確認 Apps Script 部署為「任何人」。" +
          (err.message ? " (" + err.message + ")" : "")
      );
    }

    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (_) {
      const hint =
        /sign in|accounts\.google|許可|授權/i.test(text)
          ? "部署存取權請選「任何人」（Anyone）。"
          : "請重新部署：管理部署作業 → 編輯 → 新版本；執行身分「我」、存取權「任何人」。也可在瀏覽器開 API 網址加 ?action=bootstrap 測試。";
      throw new Error("Google 沒有回傳 JSON（HTTP " + res.status + "）。" + hint);
    }
    if (json.error) throw new Error(json.error);
    return json;
  }

  function usingRemote() {
    return Boolean(window.APP_CONFIG.APPS_SCRIPT_URL && window.APP_CONFIG.APPS_SCRIPT_URL.trim());
  }

  async function api(action, payload) {
    if (usingRemote()) {
      try {
        return await remoteCall(action, payload);
      } catch (err) {
        if (action === "bootstrap") {
          console.warn("[室況台] 連線失敗，改用本機示範：", err);
          const local = await localCall("bootstrap");
          local.mode = "local-fallback";
          local._remoteError = String(err.message || err);
          return local;
        }
        throw err;
      }
    }
    return localCall(action, payload);
  }

  window.API = {
    usingRemote,
    todayISO,
    addDays,
    isDue,
    bootstrap: () => api("bootstrap"),
    createIssue: (payload) => api("createIssue", payload),
    addUpdate: (payload) => api("addUpdate", payload),
    deleteIssue: (issueId) => api("deleteIssue", { issueId }),
    resetLocal: () => localStorage.removeItem(STORAGE_KEY),
  };
})();

    <script>
(function () {
  const state = {
    rooms: [],
    issues: [],
    updates: [],
    mode: "local",
    view: "home",
    params: {},
    identity: loadIdentity(),
  };

  function loadIdentity() {
    try {
      return JSON.parse(localStorage.getItem("lab-desk-identity") || "null") || {
        name: "",
        role: "teacher",
      };
    } catch {
      return { name: "", role: "teacher" };
    }
  }

  function saveIdentity(name, role) {
    state.identity = { name: name.trim(), role };
    localStorage.setItem("lab-desk-identity", JSON.stringify(state.identity));
    renderHeader();
  }

  function toast(msg) {
    const root = document.getElementById("toast-root");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const [y, m, d] = iso.slice(0, 10).split("-");
    return `${y}年${Number(m)}月${Number(d)}日`;
  }

  function formatDateShort(iso) {
    if (!iso) return "—";
    const [, m, d] = iso.slice(0, 10).split("-");
    return `${Number(m)}/${Number(d)}`;
  }

  function nextCheck(iso) {
    return API.addDays(iso, window.APP_CONFIG.CHECK_INTERVAL_DAYS);
  }

  function daysBetween(from, to) {
    const a = Date.parse(from + "T00:00:00");
    const b = Date.parse(to + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  function badge(status) {
    return `<span class="badge badge-${status}">${CATALOG.statusLabel(status)}</span>`;
  }

  function barClass(status, due) {
    if (due) return "bar-warn";
    return "bar-" + (status || "reported");
  }

  function requireIdentity() {
    if (!state.identity.name) {
      openIdentityModal();
      toast("請先填寫你的名稱");
      return false;
    }
    return true;
  }

  /* ---------- routing ---------- */
  function parseHash() {
    const h = (location.hash || "#/").replace(/^#/, "") || "/";
    const parts = h.split("/").filter(Boolean);
    if (parts[0] === "rooms" && parts[1]) return { view: "room", params: { roomId: parts[1] } };
    if (parts[0] === "issues" && parts[1]) return { view: "issue", params: { issueId: Number(parts[1]) } };
    if (parts[0] === "board") return { view: "board", params: {} };
    if (parts[0] === "check-in") return { view: "checkin", params: {} };
    if (parts[0] === "report") return { view: "report", params: { room: parts[1] || "" } };
    return { view: "home", params: {} };
  }

  function navigate(path) {
    location.hash = path;
  }

  window.addEventListener("hashchange", () => {
    const r = parseHash();
    state.view = r.view;
    state.params = r.params;
    render();
  });

  /* ---------- data ---------- */
  async function refresh() {
    const data = await API.bootstrap();
    state.rooms = data.rooms || [];
    state.issues = data.issues || [];
    state.updates = data.updates || [];
    state.mode = data.mode || (API.usingRemote() ? "remote" : "local");
  }

  function openIssues() {
    return state.issues.filter((i) => i.status !== "done");
  }

  function dueIssues() {
    return openIssues().filter(API.isDue).sort((a, b) => a.last_checked_on.localeCompare(b.last_checked_on));
  }

  /* ---------- header ---------- */
  function renderHeader() {
    const id = state.identity;
    const chip = document.getElementById("identity-chip");
    const mobileId = document.getElementById("mobile-identity");
    const label = id.name
      ? `<strong>${escapeHtml(id.name)}</strong><span>${CATALOG.roleLabel(id.role)}</span>`
      : `<span style="color:var(--muted)">設定身分</span>`;
    if (chip) chip.innerHTML = label;
    if (mobileId) mobileId.textContent = id.name || "身分";

    document.querySelectorAll("[data-nav]").forEach((a) => {
      const v = a.getAttribute("data-nav");
      a.classList.toggle("active", state.view === v || (v === "home" && state.view === "home"));
    });
  }

  /* ---------- views ---------- */
  function renderHome() {
    const open = openIssues();
    const due = dueIssues();
    const doneMonth = state.issues.filter((i) => {
      if (i.status !== "done") return false;
      const now = API.todayISO();
      return i.last_checked_on.slice(0, 7) === now.slice(0, 7);
    }).length;

    const byWing = {};
    state.rooms
      .slice()
      .sort((a, b) => a.sort_order - b.sort_order)
      .forEach((r) => {
        (byWing[r.wing] ??= []).push(r);
      });

    const dueList = due
      .slice(0, 4)
      .map(
        (i) => `
      <a href="#/issues/${i.id}" class="issue-card" style="margin-top:0.5rem;background:color-mix(in srgb,var(--surface) 70%,transparent)">
        <div class="body" style="padding-left:0">
          <div class="flex-between">
            <div style="min-width:0;flex:1">
              <div style="font-size:0.875rem;font-weight:500">${escapeHtml(i.room_code)} ${escapeHtml(i.room_name)} · ${escapeHtml(i.title)}</div>
              <div class="meta">上次更新 ${formatDate(i.last_checked_on)} · 應於 ${formatDate(nextCheck(i.last_checked_on))} 前點名</div>
            </div>
            ${badge(i.status)}
          </div>
        </div>
      </a>`,
      )
      .join("");

    let roomsHtml = "";
    Object.entries(byWing).forEach(([wing, rooms]) => {
      roomsHtml += `<h2 class="section-title">${CATALOG.wingLabel(wing)}</h2><div class="room-grid">`;
      rooms.forEach((room) => {
        const roomOpen = open.filter((i) => i.room_id === room.id);
        const roomDue = roomOpen.filter(API.isDue);
        const latest = roomOpen.sort((a, b) => a.last_checked_on.localeCompare(b.last_checked_on))[0];
        const healthy = roomOpen.length === 0;
        roomsHtml += `
          <a class="room-card" href="#/rooms/${room.id}">
            <span class="bar ${healthy ? "bar-done" : roomDue.length ? "bar-warn" : barClass(latest?.status)}"></span>
            <div class="body">
              <div class="flex-between">
                <span class="meta" style="font-family:ui-monospace,monospace">${escapeHtml(room.code)} · ${escapeHtml(room.floor)}</span>
                <span class="meta" style="font-weight:500;color:${healthy ? "var(--done)" : roomDue.length ? "var(--warn)" : "var(--muted)"}">
                  ${healthy ? "良好" : roomDue.length ? roomDue.length + " 項待點名" : roomOpen.length + " 項進行中"}
                </span>
              </div>
              <h3 style="margin:0.25rem 0 0;font-size:1.25rem">${escapeHtml(room.name)}</h3>
              <p class="muted" style="margin:0.5rem 0 0;font-size:0.875rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
                ${healthy ? "目前沒有未完成項目。" : escapeHtml(latest?.title || "")}
              </p>
              ${!healthy && latest ? `<div class="mt-3">${badge(latest.status)}</div>` : ""}
            </div>
          </a>`;
      });
      roomsHtml += `</div>`;
    });

    return `
      ${modeBanner()}
      <header class="page-header">
        <p class="eyebrow">${window.APP_CONFIG.SCHOOL_YEAR} · 理科組</p>
        <h1>各室現況</h1>
        <p>老師發現問題即時開單，技術員與校務處在同一時間線跟進。未完成項目每 ${window.APP_CONFIG.CHECK_INTERVAL_DAYS} 日須點名一次，即使維持原狀。</p>
      </header>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">進行中</div><div class="value">${open.length}</div></div>
        <div class="stat-card ${due.length ? "warn" : ""}"><div class="label">待本月點名</div><div class="value">${due.length}</div></div>
        <div class="stat-card"><div class="label">本月完成</div><div class="value">${doneMonth}</div></div>
        <div class="stat-card"><div class="label">室數</div><div class="value">${state.rooms.length}</div></div>
      </div>
      ${
        due.length
          ? `<section class="alert-box mt-4">
              <div class="flex-between">
                <div>
                  <h2>${due.length} 項已超過 ${window.APP_CONFIG.CHECK_INTERVAL_DAYS} 日未更新</h2>
                  <p>請打電話、問校務處或現場覆查後寫一句——維持原狀也要記。</p>
                </div>
                <a class="btn btn-secondary btn-sm" href="#/check-in">去點名</a>
              </div>
              ${dueList}
            </section>`
          : ""
      }
      ${roomsHtml}
      <div class="legend mt-4">${CATALOG.STATUSES.map((s) => badge(s.id)).join("")}</div>
    `;
  }

  function renderRoom() {
    const room = state.rooms.find((r) => r.id === state.params.roomId);
    if (!room) return `<p class="muted">找不到此室。</p>`;
    const issues = state.issues
      .filter((i) => i.room_id === room.id)
      .sort((a, b) => (a.status === "done") - (b.status === "done") || a.last_checked_on.localeCompare(b.last_checked_on));
    const open = issues.filter((i) => i.status !== "done");
    const closed = issues.filter((i) => i.status === "done");

    function list(items) {
      if (!items.length) return `<p class="muted">沒有進行中的問題。</p>`;
      return items
        .map((i) => {
          const due = API.isDue(i);
          const uc = state.updates.filter((u) => u.issue_id === i.id).length;
          return `
          <a class="issue-card" href="#/issues/${i.id}">
            <span class="bar ${barClass(i.status, due)}"></span>
            <div class="body">
              <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center">

                i.status !== "done" ? " · 下次點名 " + formatDate(nextCheck(i.last_checked_on)) : ""
              } · ${uc} 則紀錄</p>
            </div>
          </a>`;
        })
        .join("");
    }

    return `
      <a class="link-back" href="#/">← 返回總覽</a>
      <div class="flex-between page-header" style="margin-bottom:1.5rem">
        <div>
          <p class="meta" style="font-family:ui-monospace,monospace">${escapeHtml(room.code)} · ${escapeHtml(room.floor)} · ${CATALOG.wingLabel(room.wing)}</p>
          <h1 style="margin:0.25rem 0 0">${escapeHtml(room.name)}</h1>

    if (!issue) return `<p class="muted">找不到此紀錄。</p>`;
    const updates = state.updates
      .filter((u) => u.issue_id === id)
      .sort((a, b) => a.happened_on.localeCompare(b.happened_on) || (a.id || 0) - (b.id || 0));
    const due = API.isDue(issue);
    const age = daysBetween(issue.reported_on, API.todayISO());

      .map(
        (u, idx) => `
      <li>
        <span class="dot ${idx === updates.length - 1 ? "latest" : ""}"></span>

        <p style="margin:0.5rem 0 0;font-size:0.875rem">${escapeHtml(u.note)}</p>
      </li>`,
      )
      .join("");

    return `
      <a class="link-back" href="#/rooms/${issue.room_id}">← ${escapeHtml(issue.room_code)} ${escapeHtml(issue.room_name)}</a>
      <div class="detail-panel">
        <span class="bar ${barClass(issue.status, due)}"></span>
        <div class="inner">
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center">
            ${badge(issue.status)}
            <span class="meta">${CATALOG.categoryLabel(issue.category)}</span>
            ${due ? `<span class="badge" style="background:var(--warn-bg);color:var(--warn)">待本月點名</span>` : ""}

          <dl class="meta-grid">
            <div><dt>發現日期</dt><dd>${formatDate(issue.reported_on)}</dd></div>
            <div><dt>已持續</dt><dd>${age >= 365 ? Math.floor(age / 365) + " 年" : age + " 日"}</dd></div>
            <div><dt>負責人</dt><dd>${escapeHtml(issue.assignee || "未指定")}</dd></div>
            <div><dt>下次點名</dt><dd>${issue.status === "done" ? "已結案" : formatDate(nextCheck(issue.last_checked_on))}</dd></div>
          </dl>
        </div>
      </div>
      ${
        issue.status !== "done"
          ? `<section class="form-card mt-4">
              <h2 style="margin:0;font-size:1.125rem">寫入跟進</h2>
              <p class="muted" style="margin:0.35rem 0 1rem">技術員、校務處或理科組都可以更新。維持原狀也請點名。</p>
              ${followUpFormHtml(issue, false)}
            </section>`
          : ""
      }
      <section class="mt-4">
        <h2 class="section-title" style="margin-top:0">時間線</h2>
        <ol class="timeline">${timeline || "<li class='muted'>尚無紀錄</li>"}</ol>
      </section>
      <div class="mt-4">
        <button type="button" class="delete-btn" data-delete-issue="${issue.id}">刪除此問題（錯誤輸入時使用）</button>
      </div>
    `;
  }

  function followUpFormHtml(issue, compact) {
    const statusOpts = CATALOG.STATUSES.map(
      (s) => `<option value="${s.id}" ${s.id === issue.status ? "selected" : ""}>${s.label}</option>`,
    ).join("");
    return `
      <form class="stack gap-4" data-follow-up="${issue.id}" data-compact="${compact ? "1" : "0"}">
        <div class="form-grid ${compact ? "" : "form-grid-2"}">
          <div class="field">
            <label>狀態</label>
            <select name="status">${statusOpts}</select>
          </div>
          ${
            compact
              ? ""
              : `<div class="field">
                  <label>跟進日期</label>
                  <input type="date" name="happenedOn" value="${API.todayISO()}" required />
                </div>`
          }
        </div>
        ${
          compact
            ? ""
            : `<div class="field">
                <label>負責人</label>
                <input name="assignee" value="${escapeAttr(issue.assignee || "")}" placeholder="跟進同事" />
              </div>`
        }
        <div class="field">
          <label>${compact ? "本月情況" : "跟進說明"}</label>
          <textarea name="note" ${compact ? 'class="" style="min-height:5rem"' : ""} placeholder="${
            compact
              ? "即使維持原狀，也請寫一句。例如：仍未修復，繼續報 Phoebe。"
              : "寫下檢查、報修、報價或完工情況。"
          }"></textarea>
        </div>
        <div class="actions-row">
          <button type="submit" class="btn btn-primary">${compact ? "完成本月點名" : "加入跟進"}</button>
          <button type="button" class="btn btn-secondary" data-keep-status="${issue.id}">維持原狀</button>
        </div>
      </form>`;
  }

  function renderCheckin() {
    const due = dueIssues();
    if (!due.length) {
      return `
        ${modeBanner()}
        <header class="page-header">
          <h1>本月點名</h1>
          <p>未完成的問題每 ${window.APP_CONFIG.CHECK_INTERVAL_DAYS} 日必須更新一次。結果即使是「維持原狀」，也請按一下。</p>
        </header>
        <div class="empty-ok">
          <h2>本月沒有逾期項目</h2>
          <p>所有進行中的問題都在期限內更新過。</p>
        </div>`;
    }
    return `
      ${modeBanner()}
      <header class="page-header">
        <h1>本月點名</h1>
        <p>未完成的問題每 ${window.APP_CONFIG.CHECK_INTERVAL_DAYS} 日必須更新一次。打電話問校務處、問技術員、或自己去看都可以。</p>
      </header>
      <div class="stack gap-4">
        ${due
          .map(
            (i) => `
          <div class="form-card">
            <div class="flex-between">
              <div>
                <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center">
                  ${badge(i.status)}
                  <a class="meta" href="#/rooms/${i.room_id}">${escapeHtml(i.room_code)} ${escapeHtml(i.room_name)}</a>
                </div>
                <h2 style="margin:0.5rem 0 0;font-size:1rem;font-family:var(--font);font-weight:500">
                  <a href="#/issues/${i.id}">${escapeHtml(i.title)}</a>
                </h2>
                <p class="meta mt-2">上次更新 ${formatDate(i.last_checked_on)} · 應於 ${formatDate(nextCheck(i.last_checked_on))} 前點名${
                  i.assignee ? " · " + escapeHtml(i.assignee) : ""
                }</p>
              </div>
            </div>
            <div class="mt-4" style="border-top:1px solid var(--border);padding-top:1rem">
              ${followUpFormHtml(i, true)}
            </div>
          </div>`,
          )
          .join("")}
      </div>`;
  }

  function renderBoard() {
    const grouped = state.rooms
      .slice()
      .sort((a, b) => a.sort_order - b.sort_order)
      .map((room) => ({
        room,
        issues: state.issues.filter((i) => i.room_id === room.id),
      }));

    const mobile = grouped
      .map(({ room, issues }) => {
        if (!issues.length) {
          return `<section class="mobile-room-block">
            <a href="#/rooms/${room.id}"><span class="meta" style="font-family:ui-monospace,monospace">${escapeHtml(room.code)}</span>
            <strong style="display:block;margin-top:0.15rem">${escapeHtml(room.name)}</strong>
            <span class="meta">${CATALOG.wingLabel(room.wing)}</span></a>
            <p class="mt-3" style="color:var(--done);font-size:0.875rem;margin:0">狀態良好</p>
          </section>`;
        }
        return `<section class="mobile-room-block">
          <a href="#/rooms/${room.id}"><span class="meta" style="font-family:ui-monospace,monospace">${escapeHtml(room.code)}</span>
          <strong style="display:block;margin-top:0.15rem">${escapeHtml(room.name)}</strong>
          <span class="meta">${CATALOG.wingLabel(room.wing)}</span></a>
          ${issues
            .map(
              (i) => `
            <div class="issue-row">
              <a href="#/issues/${i.id}" style="font-weight:500">${escapeHtml(i.title)}</a>
              <div class="mt-2" style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center">
                ${badge(i.status)}
                <span class="meta">${escapeHtml(i.assignee || "未指定")} · ${formatDateShort(i.last_checked_on)}${
                  i.status !== "done" ? " · 下次 " + formatDateShort(nextCheck(i.last_checked_on)) : ""
                }${API.isDue(i) ? " · 待點名" : ""}</span>
                <button type="button" class="delete-btn" data-delete-issue="${i.id}">刪除</button>
              </div>
            </div>`,
            )
            .join("")}
        </section>`;
      })
      .join("");

    let rows = "";
    grouped.forEach(({ room, issues }) => {
      if (!issues.length) {
        rows += `<tr>
          <td>${roomCell(room)}</td>
          <td colspan="5" style="color:var(--done)">狀態良好</td>
        </tr>`;
        return;
      }
      issues.forEach((i, idx) => {
        rows += `<tr>
          ${idx === 0 ? `<td rowspan="${issues.length}">${roomCell(room)}</td>` : ""}
          <td>
            <a href="#/issues/${i.id}" style="font-weight:500">${escapeHtml(i.title)}</a>
            <div class="meta mt-2">${CATALOG.categoryLabel(i.category)}${API.isDue(i) ? " · 待點名" : ""}</div>
          </td>
          <td>${badge(i.status)}</td>
          <td class="muted">${escapeHtml(i.assignee || "—")}</td>
          <td class="muted" style="font-variant-numeric:tabular-nums">${formatDateShort(i.last_checked_on)}</td>
          <td>
            <div class="muted" style="font-variant-numeric:tabular-nums">${
              i.status === "done" ? "—" : formatDateShort(nextCheck(i.last_checked_on))
            }</div>
            <button type="button" class="delete-btn mt-2" data-delete-issue="${i.id}">刪除</button>
          </td>
        </tr>`;
      });
    });

    return `
      ${modeBanner()}
      <header class="page-header flex-between">
        <div>
          <p class="eyebrow">開會用</p>
          <h1>會議總表</h1>
          <p>取代 Word／Excel 的學期檢查表。資料存在 Google Sheet；錯誤輸入可按「刪除」。</p>
        </div>
        <button type="button" class="btn btn-secondary" id="btn-export-csv">匯出 CSV</button>
      </header>
      <div class="board-mobile">${mobile}</div>
      <div class="board-desktop table-wrap">
        <table class="board">
          <thead>
            <tr>
              <th>地點</th><th>現況</th><th>狀態</th><th>負責人</th><th>上次更新</th><th>下次點名</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function roomCell(room) {
    return `<a href="#/rooms/${room.id}">
      <span class="meta" style="font-family:ui-monospace,monospace">${escapeHtml(room.code)}</span>
      <strong style="display:block;margin-top:0.15rem">${escapeHtml(room.name)}</strong>
      <span class="meta">${CATALOG.wingLabel(room.wing)}</span>
    </a>`;
  }

  function renderReport() {
    const roomOpts = state.rooms
      .slice()
      .sort((a, b) => a.sort_order - b.sort_order)
      .map(
        (r) =>
          `<option value="${r.id}" ${state.params.room === r.id ? "selected" : ""}>${escapeHtml(r.code)} ${escapeHtml(r.name)}</option>`,
      )
      .join("");
    const catOpts = CATALOG.CATEGORIES.map((c) => `<option value="${c.id}">${c.label}</option>`).join("");
    const statusOpts = CATALOG.STATUSES.filter((s) => s.id !== "done")
      .map((s) => `<option value="${s.id}">${s.label}</option>`)
      .join("");

    return `
      ${modeBanner()}
      <header class="page-header">
        <h1>報告問題</h1>
        <p>見到冷氣壞、窗損壞、洗眼器沒水，直接開單。之後技術員會在同一張單寫跟進，直到「完成」。</p>
      </header>
      <div class="form-card" style="max-width:36rem">
        <form id="report-form" class="stack gap-4">
          <div class="field">
            <label>地點</label>
            <select name="roomId" required>
              <option value="" disabled ${state.params.room ? "" : "selected"}>選擇實驗室或特別室</option>
              ${roomOpts}
            </select>
          </div>
          <div class="field">
            <label>問題摘要</label>
            <input name="title" required maxlength="200" placeholder="例如：三部冷氣損壞，室溫極高" />
          </div>
          <div class="form-grid form-grid-2">
            <div class="field"><label>類別</label><select name="category">${catOpts}</select></div>
            <div class="field"><label>狀態</label><select name="status">${statusOpts}</select></div>
          </div>
          <div class="form-grid form-grid-2">
            <div class="field"><label>發現日期</label><input type="date" name="reportedOn" value="${API.todayISO()}" required /></div>
            <div class="field"><label>負責人（可空）</label><input name="assignee" placeholder="例如：Phoebe、豪哥" /></div>
          </div>
          <div class="field">
            <label>情況說明</label>
            <textarea name="note" required placeholder="寫下你見到的情況。技術員之後會在同一張單繼續跟進。"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">提交紀錄</button>
        </form>
      </div>`;
  }

  function modeBanner() {
    if (state.mode === "remote") {
      return `<div class="mode-banner">已連接 Google Sheet（雲端同步）</div>`;
    }
    if (state.mode === "local-fallback") {
      return `<div class="mode-banner" style="background:var(--danger-bg);color:var(--danger)">未能連接 Google Sheet，暫時用本機示範資料。請確認 Apps Script 部署為「任何人」，並用 http://localhost 或 GitHub Pages 開啟（不要用 file://）。</div>`;
    }
    return `<div class="mode-banner">示範模式：資料存在此瀏覽器。要給同事共用，請在 <code>js/config.js</code> 填入 Apps Script 網址。</div>`;
  }

  /* ---------- render ---------- */
  function render() {
    renderHeader();
    const root = document.getElementById("app");
    let html = "";
    switch (state.view) {
      case "room":
        html = renderRoom();
        break;
      case "issue":
        html = renderIssue();
        break;
      case "board":
        html = renderBoard();
        break;
      case "checkin":
        html = renderCheckin();
        break;
      case "report":
        html = renderReport();
        break;
      default:
        html = renderHome();
    }
    root.innerHTML = html;
    bindViewEvents();
  }

  function bindViewEvents() {
    document.querySelectorAll("[data-follow-up]").forEach((form) => {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!requireIdentity()) return;
        const issueId = Number(form.getAttribute("data-follow-up"));
        const fd = new FormData(form);
        const note = String(fd.get("note") || "").trim();
        if (!note) {
          toast("請先寫下跟進說明");
          return;
        }
        const status = String(fd.get("status"));
        const happenedOn = String(fd.get("happenedOn") || API.todayISO());
        const assignee = fd.get("assignee");
        try {
          await API.addUpdate({
            issueId,
            status,
            note,
            happenedOn,
            authorName: state.identity.name,
            authorRole: state.identity.role,
            assignee: assignee !== null ? String(assignee) : undefined,
          });
          toast("已寫入跟進");
          await refresh();
          render();
        } catch (err) {
          toast(err.message || "無法儲存");
        }
      });
    });

    document.querySelectorAll("[data-keep-status]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!requireIdentity()) return;
        const issueId = Number(btn.getAttribute("data-keep-status"));
        const issue = state.issues.find((i) => i.id === issueId);
        if (!issue) return;
        try {
          await API.addUpdate({
            issueId,
            status: issue.status,
            note: "維持原狀，本月已點名。",
            happenedOn: API.todayISO(),
            authorName: state.identity.name,
            authorRole: state.identity.role,
            assignee: issue.assignee,
          });
          toast("已寫入跟進");
          await refresh();
          render();
        } catch (err) {
          toast(err.message || "無法儲存");
        }
      });
    });

    document.querySelectorAll("[data-delete-issue]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const issueId = Number(btn.getAttribute("data-delete-issue"));
        const issue = state.issues.find((i) => i.id === issueId);
        if (!issue) return;
        if (
          !confirm(
            `確定刪除「${issue.room_code} ${issue.title}」？\n此操作會一併刪除時間線紀錄，無法復原。`,
          )
        ) {
          return;
        }
        try {
          await API.deleteIssue(issueId);
          toast("已刪除");
          await refresh();
          if (state.view === "issue") navigate("#/");
          else render();
        } catch (err) {
          toast(err.message || "無法刪除");
        }
      });
    });

    const reportForm = document.getElementById("report-form");
    if (reportForm) {
      reportForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!requireIdentity()) return;
        const fd = new FormData(reportForm);
        try {
          const res = await API.createIssue({
            roomId: String(fd.get("roomId")),
            title: String(fd.get("title") || "").trim(),
            category: String(fd.get("category")),
            status: String(fd.get("status")),
            assignee: String(fd.get("assignee") || "").trim(),
            note: String(fd.get("note") || "").trim(),
            reportedOn: String(fd.get("reportedOn")),
            authorName: state.identity.name,
            authorRole: state.identity.role,
          });
          toast("已記錄問題");
          await refresh();
          navigate("#/issues/" + res.id);
        } catch (err) {
          toast(err.message || "無法儲存");
        }
      });
    }

    const exportBtn = document.getElementById("btn-export-csv");
    if (exportBtn) {
      exportBtn.addEventListener("click", () => {
        const header = ["地點編號", "地點", "組別", "問題", "類別", "狀態", "負責人", "發現日期", "上次更新", "下次點名"];
        const rows = state.issues.map((i) => [
          i.room_code,
          i.room_name,
          CATALOG.wingLabel(i.room_wing),
          i.title,
          CATALOG.categoryLabel(i.category),
          CATALOG.statusLabel(i.status),
          i.assignee,
          i.reported_on,
          i.last_checked_on,
          i.status === "done" ? "" : nextCheck(i.last_checked_on),
        ]);
        const csv = [header, ...rows]
          .map((row) => row.map((c) => `"${String(c).replaceAll('"', '""')}"`).join(","))
          .join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "室況台.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }
  function escapeAttr(s) {
    return escapeHtml(s).replaceAll("'", "&#39;");
  }

  /* ---------- identity modal ---------- */
  function openIdentityModal() {
    document.getElementById("identity-modal").classList.remove("hidden");
    document.getElementById("identity-name").value = state.identity.name || "";
    document.querySelectorAll(".role-btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.role === state.identity.role);
    });
  }

  function closeIdentityModal() {
    document.getElementById("identity-modal").classList.add("hidden");
  }

  document.getElementById("identity-chip")?.addEventListener("click", openIdentityModal);
  document.getElementById("mobile-identity")?.addEventListener("click", openIdentityModal);
  document.getElementById("identity-close")?.addEventListener("click", closeIdentityModal);
  document.getElementById("identity-form")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("identity-name").value;
    const role = document.querySelector(".role-btn.active")?.dataset.role || "teacher";
    if (!name.trim()) return;
    saveIdentity(name, role);
    closeIdentityModal();
    toast("已記住身分");
  });
  document.querySelectorAll(".role-btn").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".role-btn").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
    });
  });

  /* ---------- boot ---------- */
  async function boot() {
    try {
      await refresh();
    } catch (err) {
      console.error(err);
      toast("載入失敗：" + (err.message || err));
      state.rooms = CATALOG.ROOMS;
      state.issues = [];
      state.updates = [];
    }
    const r = parseHash();
    state.view = r.view;
    state.params = r.params;
    render();
  }

  boot();
})();

    </script>
  </body>
</html>
